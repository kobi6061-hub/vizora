<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PROPX — כניסה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='.5' y='.5' width='23' height='23' rx='5.5' fill='%23ffffff' stroke='%23c9ced6' stroke-width='1'/%3E%3Ctext x='12' y='16.2' font-family='Montserrat,Helvetica,Arial,sans-serif' font-size='10.5' letter-spacing='.6' text-anchor='middle' fill='%23111318'%3EPX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600;700&family=Montserrat:wght@300&display=swap">
<style>
:root{
  --bg:#0b1322; --bg-2:#0e1830; --card:#111d36; --line:#233252; --line-2:#2c3d63;
  --ink:#f2f5fb; --ink-2:#aab6cf; --ink-3:#71809f;
  --blue:#3b82f6; --blue-deep:#2563eb; --gold:#c9a227; --red:#ef6a5e;
}
*{margin:0;padding:0;box-sizing:border-box;border:0;font:inherit;color:inherit}
html,body{height:100%}
body{
  font-family:Assistant,Heebo,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1100px 520px at 82% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(800px 420px at 12% 110%, rgba(201,162,39,.07), transparent 60%),
    var(--bg);
  color:var(--ink); display:grid; place-items:center; padding:24px;
}
.card{
  width:100%; max-width:392px; background:linear-gradient(180deg,var(--card),var(--bg-2));
  border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.6), 0 2px 8px -2px rgba(0,0,0,.4);
}
.rib{height:3px;background:linear-gradient(to left,var(--blue-deep),var(--blue) 55%,var(--gold))}
.in{padding:30px 30px 26px;display:flex;flex-direction:column;gap:0;text-align:center}
.mark{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;margin-bottom:4px}
.wordmark{text-align:center;line-height:1.3}
.wordmark b{display:block;font-family:Montserrat,Heebo,sans-serif;font-size:27px;font-weight:300;
  letter-spacing:.44em;margin-inline-end:-.44em;color:var(--ink)}
.wordmark span{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);margin-top:5px}
h1{font-family:Heebo,sans-serif;font-size:15.5px;font-weight:700;margin-top:14px}
.sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.caveat{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gold)}
.caveat small{display:block;font-weight:600;letter-spacing:.14em;font-size:9px;color:var(--ink-3);margin-top:2px;text-transform:uppercase}
form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
input[type=password]{
  height:46px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;
  padding-inline:14px;font-size:15px;text-align:center;letter-spacing:.12em;color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
input[type=password]::placeholder{color:var(--ink-3);letter-spacing:.3em}
input[type=password]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
button{
  height:46px;border-radius:10px;background:linear-gradient(180deg,var(--blue),var(--blue-deep));
  color:#fff;font-family:Heebo,sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;
  transition:filter .15s, transform .05s;
}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:18px;font-size:12.5px;font-weight:700;color:var(--red);opacity:0;transition:opacity .15s}
.err.on{opacity:1}
.card.shake{animation:sh .3s ease}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}55%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
@media(prefers-reduced-motion:reduce){.card.shake{animation:none}}
.foot{margin-top:14px;font-size:10.5px;color:var(--ink-3)}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="rib"></div>
    <div class="in">
      <div class="mark">
        <span class="wordmark"><b>PROPX</b><span>מידע הוא הנכס הראשון</span></span>
      </div>
      <h1>מודיעין שוק הדירות החדשות בישראל</h1>
      <p class="sub">הזינו סיסמה כדי להיכנס למערכת</p>
      <p class="caveat">לשימוש פנימי בלבד<small>Internal use only</small></p>
      <form id="f" autocomplete="off">
        <input id="pw" type="password" inputmode="text" autocomplete="current-password"
               aria-label="סיסמה" placeholder="••••••••" autofocus>
        <button id="go" type="submit">כניסה למערכת</button>
        <p class="err" id="err" role="alert">סיסמה שגויה — נסו שוב</p>
      </form>
      <p class="foot">PROPX · מידע הוא הנכס הראשון · v3</p>
    </div>
  </main>
<script>
(function(){
  var f=document.getElementById('f'),pw=document.getElementById('pw'),
      err=document.getElementById('err'),go=document.getElementById('go'),
      card=document.getElementById('card');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    err.classList.remove('on'); go.disabled=true; go.textContent='מאמת…';
    fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({password:pw.value})})
      .then(function(r){
        if(r.ok){location.replace('/');return;}
        throw r.status;
      })
      .catch(function(st){
        go.disabled=false; go.textContent='כניסה למערכת';
        if(st===503){
          err.textContent='המערכת עדיין לא הוגדרה בשרת — יש להגדיר את משתני הסביבה SITE_PASSWORD ו־SESSION_SECRET ב־Vercel (לכל הסביבות) ולבצע Redeploy';
        }else{
          err.textContent='סיסמה שגויה — נסו שוב'; pw.value='';
        }
        err.classList.add('on'); pw.focus();
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      });
  });
  pw.addEventListener('input',function(){err.classList.remove('on')});
})();
</script>
</body>
</html>
