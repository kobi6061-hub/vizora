# PROPX · CBS new-home sales — daily check of the official monthly series (national + 7 districts).
#
# CBS publishes new-dwelling sales once a month, about six weeks after the month ends, around 10:50 UTC on a working
# day (Sun–Thu). This job checks every working day shortly after that, so a release — or a revision of earlier
# months — reaches the site the same day. scripts/cbs-sales-sync.js keeps every published value (append-only, with
# revisions), the raw responses per content hash, and the page payload; a failed source keeps its last data, marked.
# Nothing outside data/cbs-sales/ is touched. `validate` re-reads CBS and compares the stored values (read-only).

name: CBS new-home sales sync

on:
  schedule:
    - cron: '23 12 * * 0-4'   # Sun–Thu 12:23 UTC = 15:23 Israel (summer) / 14:23 (winter)
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync (write + commit) · dry-run (fetch and print) · validate (compare stored values with CBS, read-only)'
        type: choice
        options: [sync, dry-run, validate]
        default: sync

permissions:
  contents: write

concurrency:
  group: cbs-sales-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MODE: ${{ inputs.mode || 'sync' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline tests (must pass before any data is written)
        run: node test/cbs-sales.test.js

      - name: Read the official series
        id: sync
        run: |
          set +e
          case "$MODE" in
            dry-run)  node scripts/cbs-sales-sync.js --dry-run ;;
            validate) node scripts/cbs-sales-sync.js --validate ;;
            *)        node scripts/cbs-sales-sync.js --summary-file "$RUNNER_TEMP/summary.txt" ;;
          esac
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the data
        if: env.MODE == 'sync'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cbs-sales
          node scripts/radar-build.js && git add data/radar
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          [ -s "$RUNNER_TEMP/summary.txt" ] || echo 'CBS new-home sales: run log' > "$RUNNER_TEMP/summary.txt"
          git commit -q -F "$RUNNER_TEMP/summary.txt"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          echo 'Push failed after 3 attempts.' >&2
          exit 1

      - name: Fail the run if the source failed (or validation found a difference)
        if: steps.sync.outputs.code != '0'
        run: |
          echo "cbs-sales-sync exited with ${{ steps.sync.outputs.code }} — see the step above." >&2
          exit 1
