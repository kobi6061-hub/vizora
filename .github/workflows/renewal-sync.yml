# PROPX · daily sync of the declared urban-renewal complexes (Ministry of Construction and Housing, data.gov.il).
#
# scripts/renewal-sync.js reads every row of the official resource (paged, complete read or fail), keeps the
# Ministry's status verbatim beside a mapped stage, upserts on the complex number (never deletes), appends every
# change to data/renewal/history.jsonl and a raw snapshot when the content changed, and commits data/renewal/.
# scripts/renewal-planning-sync.js then looks every complex's plan up EXACTLY in the Planning Administration's xplan layer
# (plan number, then the Mavat main-plan id in MoCH's own link) and writes data/renewal/planning*.json + plan-geometry.json.
# Nothing outside data/renewal/ is touched. A failed source keeps the stored complexes and turns the run red.

name: Daily urban-renewal sync

on:
  schedule:
    - cron: '47 3 * * *'   # every day 03:47 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report only — write and commit nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: renewal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline test suite (must pass before any data is written)
        run: node test/renewal.test.js && node test/renewal-planning.test.js
      - name: Fetch the declared complexes
        id: sync
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then node scripts/renewal-sync.js --dry-run; else node scripts/renewal-sync.js --summary-file "$RUNNER_TEMP/summary.txt"; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Look up every complex's plan in xplan (exact plan number / Mavat id)
        id: planning
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then node scripts/renewal-planning-sync.js --dry-run; else node scripts/renewal-planning-sync.js --summary-file "$RUNNER_TEMP/summary.txt"; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/renewal
          node scripts/radar-build.js && git add data/radar
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/summary.txt"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          echo 'Push failed after 3 attempts.' >&2
          exit 1
      - name: Fail the run if a source failed
        if: steps.sync.outputs.code != '0' || steps.planning.outputs.code != '0'
        run: |
          echo "renewal-sync exited with ${{ steps.sync.outputs.code }}, renewal-planning-sync with ${{ steps.planning.outputs.code }} — see the steps above." >&2
          exit 1
