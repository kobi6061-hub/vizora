# PROPX · the transaction source as PROPX's own server runtime sees it, and
# the refresh there.
#
# The official transaction source (the Tax Authority deals layer on GovMap)
# refuses the GitHub runner (HTTP 403, recorded by data-sync.yml). This
# workflow fetches nothing from it itself: it asks the PROPX deployment
# (api/jobs/tx-refresh.js) to act server-side and prints what it answered.
# Nothing is proxied and nothing is worked around — if the source refuses that
# runtime too, the answer says so.
#
# Authentication needs no shared secret: the job mints a GitHub OIDC token
# (audience "propx-jobs"); the deployment verifies GitHub's signature and that
# the token comes from this repository's production branch and this workflow
# (lib/gov/oidc.js). A PROPX_JOB_TOKEN secret, when set, is used instead.
# Base URL: the PROPX_BASE_URL secret, else the repository's homepage (the
# production address).
#
#   mode=probe   one official request from the Vercel runtime: does the source accept it?
#   mode=sample  the page's own transaction path for a few cities (input `cities`, comma-separated)
#   mode=run     the 120-day rolling re-check of every watched area into Supabase (needs the store)

name: Transactions — server-side refresh

on:
  schedule:
    - cron: '17 3 * * *'   # daily, after data-sync.yml (02:41 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe (does the source accept the PROPX runtime?) | sample (the page path for a few cities) | run (refresh into Supabase)'
        type: choice
        options: [probe, sample, run]
        default: probe
      cities:
        description: 'sample: Hebrew city names, comma-separated (at most 6; empty = Be’er Sheva, Tel Aviv-Yafo, Jerusalem, Haifa)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write   # the OIDC token the deployment verifies

# one writer at a time with data-sync.yml (both write the transaction ledger)
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the PROPX runtime
        env:
          BASE: ${{ secrets.PROPX_BASE_URL }}
          TOKEN: ${{ secrets.PROPX_JOB_TOKEN }}
          MODE: ${{ inputs.mode || 'run' }}
          CITIES: ${{ inputs.cities }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$BASE" ]; then
            BASE=$(curl -sS "https://api.github.com/repos/$REPO" | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).homepage||"")}catch{}})')
          fi
          if [ -z "$TOKEN" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=propx-jobs" \
              | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).value||"")}catch{}})')
          fi
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo "::notice title=Not configured::No base URL (secret PROPX_BASE_URL or the repository homepage) or no token. Nothing was called."
            exit 0
          fi
          case "$BASE" in https://*) ;; *) echo "::error title=Base URL::the base URL must be https"; exit 1 ;; esac
          Q="mode=$MODE"
          if [ -n "$CITIES" ]; then Q="$Q&cities=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$CITIES")"; fi
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST --max-time 100 \
            -H "Authorization: Bearer $TOKEN" "${BASE%/}/api/jobs/tx-refresh?$Q") || code=000
          echo "HTTP $code"
          node -e '
            const fs = require("fs"); let j = {};
            try { j = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/out.json", "utf8")); } catch {}
            // server strings never become workflow commands or markdown: one line, no "::", no backticks
            const safe = (v) => String(v == null ? "" : v).replace(/[\r\n]+/g, " ").replace(/::/g, ": :").replace(/`/g, "'"'"'").slice(0, 300);
            const code = String(process.argv[1]).replace(/[^0-9]/g, "").slice(0, 3), out = [];
            const rt = j.runtime ? `${safe(j.runtime.platform)} ${safe(j.runtime.region)} ${safe(j.runtime.env)} ${safe(String(j.runtime.commit || "").slice(0, 7))}` : "";
            if (j.mode === "probe") {
              const h = j.http || {};
              out.push(`probe from ${rt}: ${j.reachable ? "the source ACCEPTED the request" : "the source did NOT accept it (" + safe(j.status) + ")"}`);
              out.push(`  ${safe(h.request)} → HTTP ${safe(h.status)} in ${safe(h.ms)} ms${h.results != null ? " · " + safe(h.results) + " results" : ""}${h.error ? " · " + safe(h.error) : ""}`);
              if (h.headers) out.push(`  edge headers: ${safe(Object.entries(h.headers).map(([k, v]) => k + "=" + v).join("; "))}`);
              if (h.bodyExcerpt) out.push(`  answer: ${safe(h.bodyExcerpt)}`);
            }
            if (j.mode === "sample") {
              out.push(`sample from ${rt} · ${safe(j.at)}`);
              for (const c of j.cities || []) {
                const k = c.counts || {};
                out.push(`${safe(c.city)}: ${safe(c.status)} in ${safe(c.ms)} ms${c.scope ? " · scope " + safe(c.scope.level) + " " + safe(c.scope.description) + " n=" + safe(c.scope.sampleSize) : ""}` +
                  (c.counts ? ` · official ${safe(k.official)} (residential ${safe(k.residential)}: new ${safe(k.newBuild)} · second-hand ${safe(k.secondHand)} · unknown ${safe(k.unknown)}) · latest ${safe(c.latestTransactionDate)}` : "") + (c.error ? " · " + safe(c.error) : ""));
                for (const u of c.unavailable || []) out.push(`  unavailable: ${safe(u)}`);
                if (c.coverage) out.push(`  coverage: polygons ${safe(c.coverage.polygonsQueried)}/${safe(c.coverage.polygonsAvailable)} · requests ${safe(c.coverage.requestsRun)}/${safe(c.coverage.requestsPlanned)} · rows ${safe(c.coverage.rowsRetrieved)} of ${safe(c.coverage.dealsCountReported)} reported`);
                for (const r of c.rows || []) out.push(`  ${safe(r.date)} · ${safe([r.street, r.houseNumber].filter(Boolean).join(" ") || "(no street in the record)")} · ${safe(r.rooms)} rooms · ${safe(r.areaSqm)} m² · floor ${safe(r.floor)} · ₪${safe(Number(r.price).toLocaleString("en-US"))} · ${safe(r.newness)}${r.dealType ? " · " + safe(r.dealType) : ""}`);
              }
            }
            if (j.mode === "run") {
              out.push(safe(j.summary), `run log recorded in Supabase: ${j.recorded ? "yes" : "NO — " + safe(j.recordError)}`);
              for (const r of j.runs || []) out.push(`${safe(r.target)}: ${safe(r.status)} · window ${safe(r.windowCheck)}${r.gaps && r.gaps.length ? " (" + safe(r.gaps.join(", ")) + ")" : ""}${r.error ? " · " + safe(r.error) : ""}`);
            }
            if (j.error) out.push(`error: ${safe(j.error)}`);
            const text = out.join("\n") || "(no answer)";
            console.log(text);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### tx-refresh (" + safe(j.mode || "?") + ") — HTTP " + code + "\n\n```\n" + text + "\n```\n");
            const warn = (t, m) => console.log(`::warning title=${t}::${m}`);
            if (j.mode === "probe" && !j.reachable) warn("Source not reachable from the PROPX runtime", safe(j.status) + " — no continuous refresh is possible from there");
            if (j.mode === "sample" && !(j.cities || []).some((c) => c.status === "ok")) warn("No official deals from the PROPX runtime", "see the summary for each city and why");
            if (j.mode === "run" && (j.runs || []).some((r) => r.windowCheck !== "complete")) warn("Window not completely re-checked", "see the summary; such runs are recorded as partial / not checked");
            if (j.error === "store-not-configured" || j.error === "store-misconfigured") console.log("::notice title=No store::mode=run needs a valid SUPABASE_URL (https://<project>.supabase.co) and SUPABASE_SERVICE_ROLE_KEY in the Vercel environment.");
          ' "$code"
          case "$code" in
            200) exit 0 ;;
            503) exit 0 ;;   # job or store not configured on the deployment — said above, not a failure of this run
            *)   exit 1 ;;
          esac
