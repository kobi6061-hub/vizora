# PROPX · Market Dossier HISTORY — the nightly APPEND-ONLY snapshot ("what changed since").
#
# scripts/dossier-snapshot.js on a GitHub runner: one Market Dossier per
# geography (Israel, the 7 districts, every locality in the radar scan) over
# the data files the syncs committed → the day's facts (value · class · source
# · period), signal ids, Radar 2.0 state and evidence quality in
# data/dossier/snapshots/<YYYY-MM-DD>.json + index.json. A day that exists is
# never rewritten and nothing is ever deleted. Reads nothing from the network.
# Nothing outside data/dossier/snapshots/ is ever touched; the radar is NOT
# rebuilt here (the syncs do that). The commit redeploys the site on Vercel.

name: Dossier history — nightly snapshot

on:
  schedule:
    - cron: '17 3 * * *'   # every day 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dossier-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline test suite (must pass before any snapshot is written)
        run: node test/dossier-history.test.js

      - name: Snapshot every geography's dossier (append-only)
        id: snap
        run: |
          set +e
          node scripts/dossier-snapshot.js --summary-file "$RUNNER_TEMP/summary.txt"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the day's snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -e data/dossier/snapshots ] && git add data/dossier/snapshots
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -q -F "$RUNNER_TEMP/summary.txt"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          echo 'Push failed after 3 attempts.' >&2
          exit 1

      - name: Fail the run if the snapshot failed
        if: steps.snap.outputs.code != '0'
        run: |
          echo "dossier-snapshot exited with ${{ steps.snap.outputs.code }} — see the step above." >&2
          exit 1
