# PROPX · street market evidence — a sweep of the deals register (republished copy, over.org.il) joined to the official
# street directory (scripts/street-evidence-sync.js; lib/streets/match.js · lib/streets/evidence.js).
#
# The sweep reads every settlement's deals of the 36 months that end on the copy's latest deal, splitting each window by
# date until every query answers in one page (completeness proven per window), one request a second. It runs again only
# when the publisher's copy changes (stats.scraped_at) — a daily check costs three requests, so a new copy is swept the day
# it appears (P0 freshness audit 19.10.2026: the check was weekly). An OLDER copy than the stored one is refused. A sweep that does not finish in
# one job keeps progress.json and the next run (scheduled or dispatched) resumes it. data/streets/evidence/ and
# data/streets/model/ (the STREET VALUE MODEL, rebuilt after a complete sweep when an input changed) are bot-written.

name: Street evidence sync

on:
  schedule:
    - cron: '41 3 * * *'   # every day 03:41 UTC: three requests when the copy is unchanged
  workflow_dispatch:
    inputs:
      force:
        description: 'Sweep although the register copy has not changed'
        type: boolean
        default: false
      only:
        description: 'Locality codes only, comma separated (a test run — marked PARTIAL)'
        type: string
        default: ''
      max_minutes:
        description: 'Stop cleanly after this many minutes (progress kept; the next run resumes)'
        type: string
        default: '320'

permissions:
  contents: write

concurrency:
  group: street-evidence-sync
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline street tests (must pass before any data is written)
        run: if [ -f test/streets.test.js ]; then node test/streets.test.js; else echo 'no street tests yet'; fi
      - name: Sweep the register and join it to the street directory
        id: sync
        env:
          FORCE: ${{ inputs.force == true }}
          ONLY: ${{ inputs.only }}
          MAX_MINUTES: ${{ inputs.max_minutes || '320' }}
        run: |
          set +e
          ARGS="--summary-file $RUNNER_TEMP/summary.txt --max-minutes $MAX_MINUTES"
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          node scripts/street-evidence-sync.js $ARGS
          echo "code=$?" >> "$GITHUB_OUTPUT"
      # The STREET VALUE MODEL (scripts/street-model-build.js) is rebuilt only when one of its inputs changed (evidence copy ·
      # directory · land parcels · model code / versions) and only on a COMPLETE sweep; its gates run on the new build, and a
      # failed build or gate restores the previous model (the observed evidence is committed either way).
      - name: Rebuild the street value model when an input changed
        id: model
        run: |
          set +e
          node scripts/street-model-build.js --if-stale > "$RUNNER_TEMP/model.txt" 2>&1
          code=$?
          if [ $code -eq 0 ] && [ -f test/street-model.test.js ]; then node test/street-model.test.js; code=$?; fi
          tail -c 2000 "$RUNNER_TEMP/model.txt"
          if [ $code -ne 0 ]; then
            echo 'Street value model build or gates failed — the previous model is kept.' >&2
            git checkout -- data/streets/model 2>/dev/null; git clean -fdq data/streets/model 2>/dev/null
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # The RECENT layer (lib/recent) is reconciled against the register copy it shows beside: a new copy swept above would make the
      # stored layer stale (the page then lists nothing), so it is reconciled again here — offline, no request; a failed
      # reconciliation or gate keeps the previous layer (which then stays hidden until street-recent-sync.yml succeeds).
      - name: Reconcile the recent layer against the register copy
        id: recent
        run: |
          set +e
          code=0
          if [ -f data/streets/recent/raw/index.json ]; then
            node scripts/street-recent-sync.js --reconcile; code=$?
            if [ $code -eq 0 ] && [ -f test/recent.test.js ]; then node test/recent.test.js; code=$?; fi
            # a newer register copy is what CONFIRMS recent deals (lib/recent/lifecycle.js) — its gates run before anything is kept
            if [ $code -eq 0 ] && [ -f test/recent-lifecycle.test.js ]; then node test/recent-lifecycle.test.js; code=$?; fi
            if [ $code -ne 0 ]; then echo 'Recent reconciliation or gates failed — the previous layer is kept.' >&2; git checkout -- data/streets/recent 2>/dev/null; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/streets/evidence data/streets/model data/streets/recent
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          [ -s "$RUNNER_TEMP/summary.txt" ] || echo 'Street evidence: run log' > "$RUNNER_TEMP/summary.txt"
          git commit -q -F "$RUNNER_TEMP/summary.txt"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 15))
          done
          echo 'Push failed after 5 attempts.' >&2
          exit 1
      - name: Fail the run if the sweep failed
        if: steps.sync.outputs.code != '0'
        run: |
          echo "street-evidence-sync exited with ${{ steps.sync.outputs.code }} — see the step above." >&2
          exit 1
      - name: Fail the run if the street value model failed
        if: steps.model.outputs.code != '0'
        run: |
          echo "the street value model build / gates exited with ${{ steps.model.outputs.code }} — the previous model was kept." >&2
          exit 1
