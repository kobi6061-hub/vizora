# PROPX · private workspace — the two-organization isolation gate (HARD BLOCKER, STEP 2A).
#
# Runs test/private-identity.test.js against a THROWAWAY PostgreSQL 16 service container: the Supabase role shim
# (supabase/private/test/supabase-roles-shim.sql, with deliberately permissive platform defaults), the private migration
# applied by a non-superuser owner, then every read and write the API can make, as each role, with the JWT claims
# PostgREST would set. No real project, no secret (the container's password below is a throwaway value of this job).
# Also runs the identity server-side tests (session cookie, token, password, API) and the Enterprise pilot's access tests
# (the site gate in identity mode, /api/login, password change / reset, revocation, rate limit) against the same database.
# Private persistence is not activated while this workflow is red.

name: Private identity — isolation gate

on:
  push:
    paths:
      - 'supabase/private/**'
      - 'lib/identity/**'
      - 'api/identity.js'
      - 'api/logout.js'
      - 'api/login.js'
      - 'middleware.js'
      - 'login.html'
      - 'scripts/kobix-dev-server.mjs'
      - 'scripts/identity-psql-adapter.js'
      - 'test/private-identity.test.js'
      - 'test/identity.test.js'
      - 'test/pilot-access.test.js'
      - 'test/helpers/middleware.js'
      - '.github/workflows/private-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway-container
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgreSQL client
        run: psql --version || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)
      - name: Two-organization isolation (HARD BLOCKER)
        env:
          PROPX_PG_URL: postgres://postgres:ci-throwaway-container@127.0.0.1:5432/postgres
        run: node test/private-identity.test.js
      - name: Identity server (sessions, tokens, passwords, API) against the same database
        env:
          PROPX_PG_URL: postgres://postgres:ci-throwaway-container@127.0.0.1:5432/postgres
        run: if [ -f test/identity.test.js ]; then node test/identity.test.js; else echo "no identity server test yet"; fi
      - name: Enterprise pilot access (site gate in identity mode, sign-in, reset, revocation, rate limit) against the same database
        env:
          PROPX_PG_URL: postgres://postgres:ci-throwaway-container@127.0.0.1:5432/postgres
        run: node test/pilot-access.test.js
