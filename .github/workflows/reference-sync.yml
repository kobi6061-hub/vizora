# PROPX · weekly sync of the official reference datasets (lib/reference): CBS Population and Housing Census 2022 by locality and
# statistical area, and the Population and Immigration Authority's registered residents by locality (data.gov.il, keyless CKAN).
#
# scripts/reference-sync.js reads every row of each resource (complete or the run fails), guards the schema, keys every record on the
# official CBS locality code (never a name) and writes data/reference/<id>/ only when the content changed (+ a dated history copy and a
# run log). Nothing outside data/reference/ is touched. A failed source keeps its stored data and turns the run red.
# The preview lane runs it on a push that changes the lane's code (scheduled runs fire on the default branch only).

name: Weekly reference-dataset sync

on:
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC (the residents resource is replaced weekly)
  push:
    branches: [claude/street-report-preview]
    paths: ['lib/reference/**', 'scripts/reference-sync.js', '.github/workflows/reference-sync.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report only — write and commit nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reference-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline test suite (must pass before any data is written)
        run: node test/reference.test.js
      - name: Read the reference datasets
        id: sync
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then node scripts/reference-sync.js --dry-run; else node scripts/reference-sync.js --summary-file "$RUNNER_TEMP/summary.txt"; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/summary.txt"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          echo 'Push failed after 5 attempts.' >&2
          exit 1
      - name: Fail the run if a source failed
        if: steps.sync.outputs.code != '0'
        run: |
          echo "reference-sync exited with ${{ steps.sync.outputs.code }} — see the step above." >&2
          exit 1
