# PROPX · weekly sync of the VATMAL declared complexes (lib/planning/vatmal): the Planning Administration's declared preferred-housing
# complexes layer (ArcGIS REST, GET). scripts/vatmal-sync.js reads every feature (complete or nothing is written) and writes
# data/planning/vatmal/ only when the content changed (+ a dated history copy and a run log). Nothing outside data/planning/vatmal/ is touched.
# The preview lane runs it on a push that changes the lane's code (scheduled runs fire on the default branch only).

name: Weekly VATMAL complexes sync

on:
  schedule:
    - cron: '47 5 * * 2'   # Tuesdays 05:47 UTC
  push:
    branches: [claude/street-report-preview]
    paths: ['lib/planning/vatmal.js', 'scripts/vatmal-sync.js', '.github/workflows/vatmal-sync.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report only — write and commit nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vatmal-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline test suite (must pass before any data is written)
        run: node test/vatmal.test.js
      - name: Read the declared-complexes layer
        id: sync
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then node scripts/vatmal-sync.js --dry-run; else node scripts/vatmal-sync.js --summary-file "$RUNNER_TEMP/summary.txt"; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/planning/vatmal
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/summary.txt"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          echo 'Push failed after 5 attempts.' >&2
          exit 1
      - name: Fail the run if a source failed
        if: steps.sync.outputs.code != '0'
        run: |
          echo "vatmal-sync exited with ${{ steps.sync.outputs.code }} — see the step above." >&2
          exit 1
