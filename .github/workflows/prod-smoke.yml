# PROPX · Production smoke (read-only).
#
# From a GitHub runner (which can reach the deployed site, unlike the
# development sandbox): the login page answers, the page and every API route
# are gated by the session middleware (302 to /login.html — never 404, never
# 500), and the deployment identifies itself. No credential is used or stored;
# nothing is written. Data behind the gate is verified locally against the
# same bundled files (test/*.test.js, browser QA) before a deploy.

name: Production smoke (read-only)

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Site origin'
        type: string
        default: 'https://propx.live'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open surfaces and gated routes
        env:
          HOST: ${{ inputs.host || 'https://propx.live' }}
        run: |
          set +e
          fail=0
          probe() {   # path · expected code(s) · expected redirect target (optional)
            local path="$1" want="$2" redir="$3"
            local out code loc vid
            out=$(curl -sS -m 20 -o /dev/null -D - "$HOST$path")
            code=$(printf '%s' "$out" | awk 'NR==1{print $2}')
            loc=$(printf '%s' "$out" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            vid=$(printf '%s' "$out" | tr -d '\r' | awk 'tolower($1)=="x-vercel-id:"{print $2}')
            if printf '%s' "$want" | grep -qw "$code" && { [ -z "$redir" ] || printf '%s' "$loc" | grep -q "$redir"; }; then
              echo "  ✓ $path → $code ${loc:+→ $loc} ${vid:+· vercel $vid}"
            else
              echo "  ✗ $path → ${code:-no answer} ${loc:+→ $loc} (wanted $want ${redir:+→ $redir})"; fail=1
            fi
          }
          echo "Production smoke on $HOST"
          probe /login.html 200
          probe /robots.txt 200
          probe / "302 307" login.html
          probe "/api/land?view=status" "302 307" login.html
          probe "/api/land?view=summary" "302 307" login.html
          probe "/api/housing?view=status" "302 307" login.html
          probe "/api/gov/transactions?settlement=5000" "302 307" login.html
          probe "/api/intel?view=status" "302 307" login.html
          probe "/api/intel?view=sources" "302 307" login.html
          probe "/api/intel?view=ddStatus" "302 307" login.html
          probe "/api/intel?view=dd&developer=x" "302 307" login.html
          probe "/api/intel?view=ddCoverage&city=5000" "302 307" login.html
          probe "/api/intel?view=group&company=511399388" "302 307" login.html
          probe "/api/geo/search?q=%D7%94%D7%A8%D7%A6%D7%9C&near=5000" "302 307" login.html
          probe "/api/intel?view=street&id=st:5000:461" "302 307" login.html
          probe "/api/intel?view=streetCoverage" "302 307" login.html
          probe "/api/intel?view=streetModel&id=st:5000:461" "302 307" login.html
          probe "/api/intel?view=streetApartment&id=st:5000:461&sqm=80" "302 307" login.html
          probe "/api/intel?view=streetModelValidation" "302 307" login.html
          probe "/api/intel?view=txFreshness" "302 307" login.html
          probe "/api/intel?view=recentLayer" "302 307" login.html
          probe "/api/intel?view=recentLayer&city=5000" "302 307" login.html
          probe "/data/streets/recent/layer.json" "302 307 404" ""
          # the transaction events (lib/txevents): every view and the bot-written files stay behind the gate
          probe "/api/intel?view=txEvents&code=7900&days=30" "302 307" login.html
          probe "/api/intel?view=txLatest&district=d-ta&months=24" "302 307" login.html
          probe "/api/intel?view=txCompleteness" "302 307" login.html
          probe "/api/gov/transactions?city=x&street=y&months=24" "302 307" login.html
          probe "/data/txevents/latest.json" "302 307 404" ""
          probe "/data/txevents/national/govmap-only.json" "302 307 404" ""
          probe "/data/streets/recent/raw/index.json" "302 307 404" ""
          probe "/api/gov/transactions?city=x&days=30" "302 307" login.html
          probe "/data/transactions/freshness.json" "302 307 404" ""
          probe "/data/streets/model/estimates.json" "302 307 404" ""
          probe "/data/streets/evidence/meta.json" "302 307 404" ""
          probe "/data/geo/streets/directory.json" "302 307 404" ""
          probe "/api/login-anything" "302 307" login.html
          probe "/api/identity?op=status" "302 307" login.html
          probe "/api/loginx" "302 307" login.html
          probe "/login.html.bak" "302 307" login.html
          probe "/robots.txt.x" "302 307" login.html
          probe "/data/land/meta.json" "302 307 404" ""
          probe "/data/dd/latest.json" "302 307 404" ""
          exit $fail
